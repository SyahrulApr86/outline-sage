[project]
name = "outline-sage-api"
version = "0.1.0"
description = "Backend RAG service for outline-sage: sync, hybrid retrieval, chat"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "httpx-retries>=0.3",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "qdrant-client>=1.9",
    "elasticsearch[async]>=8.14",
    "python-jose[cryptography]>=3.3",
    "pydantic-settings>=2.3",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "testcontainers[postgres,redis]>=4.7",
    "coverage>=7.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
